<!--
  分享預覽圖的原始檔（在 Threads、LINE、FB 貼連結時顯示的那張圖）。
  網站實際用的是轉好的 share.png（1200×630）。
  改了這個檔案之後，要重新轉成 PNG（在終端機、遊戲資料夾裡執行這兩行）：
    swift tools/render-svg.swift img/share.svg img/share.png 1200 630
    sips -z 630 1200 img/share.png
  （第一行用 WebKit 把 SVG 畫成圖；Retina 螢幕會畫成兩倍大，第二行把它縮回 1200×630）
  熊是從遊戲裡（index.html 的 #bear 舉票姿勢）複製來的，放大 2.7 倍。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- 背景：牆面和地板（跟遊戲的開票所一樣） -->
  <rect width="1200" height="630" fill="#FFF3DC"/>
  <rect y="560" width="1200" height="70" fill="#F6E3CC"/>
  <rect x="-10" y="554" width="1220" height="10" fill="#EBC9A3"/>

  <!-- ===== 熊：把選票高高舉起（遊戲裡的熊，放大 2.7 倍） ===== -->
  <g transform="translate(46.8 -453.8) scale(2.7)" stroke="#4A3B52" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <rect x="30" y="330" width="72" height="50" rx="24" fill="#C8A27A"/>
    <path d="M36 344 L22 268 M96 344 L110 268" fill="none" stroke="#4A3B52" stroke-width="17"/>
    <path d="M36 344 L22 268 M96 344 L110 268" fill="none" stroke="#C8A27A" stroke-width="11"/>
    <circle cx="42" cy="282" r="11" fill="#C8A27A"/>
    <circle cx="90" cy="282" r="11" fill="#C8A27A"/>
    <circle cx="42" cy="282" r="5" fill="#EED9BE" stroke="none"/>
    <circle cx="90" cy="282" r="5" fill="#EED9BE" stroke="none"/>
    <circle cx="66" cy="306" r="30" fill="#C8A27A"/>
    <ellipse cx="66" cy="317" rx="13" ry="9" fill="#EED9BE"/>
    <ellipse cx="66" cy="312" rx="5" ry="3.5" fill="#4A3B52" stroke="none"/>
    <path d="M60 319 q6 5 12 0" fill="none" stroke-width="2.5"/>
    <circle cx="54" cy="300" r="3.5" fill="#4A3B52" stroke="none"/>
    <circle cx="78" cy="300" r="3.5" fill="#4A3B52" stroke="none"/>
    <circle cx="47" cy="313" r="4" fill="#FFB3C7" stroke="none"/>
    <circle cx="85" cy="313" r="4" fill="#FFB3C7" stroke="none"/>
    <!-- 選票 -->
    <rect x="16" y="194" width="100" height="74" rx="3" fill="#F9B8CF"/>
    <g fill="none" stroke="#D86F95" stroke-width="1.2">
      <rect x="20" y="198" width="92" height="66"/>
      <line x1="32" y1="198" x2="32" y2="264"/>
      <line x1="58.7" y1="198" x2="58.7" y2="264"/>
      <line x1="85.3" y1="198" x2="85.3" y2="264"/>
      <line x1="32" y1="216" x2="112" y2="216"/>
      <path d="M26 202 V218 M26 236 V260" stroke-dasharray="2 2"/>
    </g>
    <rect x="22" y="222" width="8" height="10" fill="none" stroke="#E0303F" stroke-width="1.2"/>
    <g stroke="none" fill="#4A3B52" font-family="PingFang TC, Noto Sans TC, sans-serif" font-weight="700" text-anchor="middle">
      <text x="45.3" y="211" font-size="12">1</text>
      <text x="72" y="211" font-size="12">2</text>
      <text x="98.7" y="211" font-size="12">3</text>
      <text x="45.3" y="238" font-size="18">🐱</text>
      <text x="72" y="238" font-size="18">🐶</text>
      <text x="98.7" y="238" font-size="18">🦜</text>
    </g>
    <!-- 章蓋在 2 號 -->
    <g transform="translate(72 253)">
      <circle r="7.5" fill="none" stroke="#E0303F" stroke-width="1.8"/>
      <path d="M0 -7.5 V7.5 M0 0.4 L-5.3 5.3" fill="none" stroke="#E0303F" stroke-width="1.8" stroke-linecap="butt"/>
    </g>
    <circle cx="20" cy="268" r="8" fill="#C8A27A"/>
    <circle cx="112" cy="268" r="8" fill="#C8A27A"/>
  </g>

  <!-- 熊前面的開票桌 -->
  <g stroke="#4A3B52" stroke-width="5" stroke-linejoin="round">
    <rect x="20" y="520" width="400" height="26" rx="8" fill="#F5D2A8"/>
    <rect x="36" y="546" width="368" height="90" fill="#EDBE8E"/>
  </g>

  <!-- ===== 右邊的文字 ===== -->
  <g font-family="PingFang TC, Noto Sans TC, sans-serif" text-anchor="middle" fill="#4A3B52">
    <text x="790" y="175" font-size="44" font-weight="700">動物村要選村長啦！</text>
    <text x="790" y="330" font-size="136" font-weight="900" letter-spacing="6">監票大作戰</text>
    <text x="790" y="415" font-size="42" font-weight="700">提醒迷糊的志工，一起選出村長</text>
  </g>

  <!-- 「點我開始玩」按鈕的樣子 -->
  <g stroke="#4A3B52" stroke-width="5">
    <rect x="626" y="462" width="328" height="76" rx="38" fill="#4A3B52"/>
    <rect x="626" y="454" width="328" height="76" rx="38" fill="#FFE68A"/>
  </g>
  <text x="790" y="505" font-family="PingFang TC, Noto Sans TC, sans-serif" font-size="38" font-weight="800" text-anchor="middle" fill="#4A3B52">點我開始玩</text>
</svg>
